name: MakerWorld Nasik - Creator Center Monitor

on:
  schedule:
    - cron: '35 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  creator:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Creator Center statistics
        env:
          MAKERWORLD_COOKIE: ${{ secrets.MAKERWORLD_COOKIE }}
        run: python creator_monitor.py

      - name: Generate Creator Center analytics
        run: python creator_analytics.py

      - name: Save statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update MakerWorld Creator Center statistics" && git push)
