name: MakerWorld Nasik - Model Monitor

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect model statistics
        env:
          FETCHLAYER_API_KEY: ${{ secrets.FETCHLAYER_API_KEY }}
        run: python model_monitor.py

      - name: Generate model analytics
        run: python model_analytics.py

      - name: Save model statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update MakerWorld model statistics" && git push)
